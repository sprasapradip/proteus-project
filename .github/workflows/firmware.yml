name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain and simavr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr simavr libsimavr-dev libelf-dev

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: .cache
          key: arduino-${{ hashFiles('tools/build_firmware.sh') }}

      - name: Build all firmware
        run: tools/build_all.sh

      - name: Run simulator tests
        run: tools/test_all.sh

      - name: Traffic report script (demo data)
        run: python3 projects/15-vehicle-speed-detector/tools/traffic_report.py /tmp/demo.log --demo

      - name: Upload HEX files
        uses: actions/upload-artifact@v4
        with:
          name: hex-files
          path: |
            projects/*/firmware/build/*.hex
            sites/*/firmware/build/*.hex
